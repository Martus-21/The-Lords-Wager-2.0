<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-labelledby="title desc">
  <title id="title">Отворена старинна книга</title>
  <desc id="desc">Отворена книга с кремави страници, тъмночервена кожена подвързия и златни детайли.</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8d292b"/><stop offset=".45" stop-color="#5c151c"/><stop offset="1" stop-color="#310d14"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8df"/><stop offset=".65" stop-color="#ead7a7"/><stop offset="1" stop-color="#c6a56b"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8df"/><stop offset=".65" stop-color="#ead7a7"/><stop offset="1" stop-color="#c6a56b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0b0"/><stop offset=".45" stop-color="#d5a443"/><stop offset="1" stop-color="#85551e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#201006" flood-opacity=".38"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="170" rx="86" ry="10" fill="#281506" opacity=".18"/>
  <g filter="url(#shadow)">
    <!-- Кожена корица -->
    <path d="M22 65 Q62 47 116 72 L120 157 Q72 137 25 153Z" fill="url(#cover)" stroke="#351016" stroke-width="2"/>
    <path d="M218 65 Q178 47 124 72 L120 157 Q168 137 215 153Z" fill="url(#cover)" stroke="#351016" stroke-width="2"/>
    <path d="M29 69 Q67 54 111 76 L114 147 Q72 131 31 146Z" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
    <path d="M211 69 Q173 54 129 76 L126 147 Q168 131 209 146Z" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
    <!-- Страници -->
    <path d="M30 56 Q68 39 116 66 L117 145 Q74 124 31 140Z" fill="url(#pageL)" stroke="#987343" stroke-width="1.2"/>
    <path d="M210 56 Q172 39 124 66 L123 145 Q166 124 209 140Z" fill="url(#pageR)" stroke="#987343" stroke-width="1.2"/>
    <!-- Многослойни ръбове -->
    <path d="M32 142 Q75 127 117 148 M31 146 Q74 132 117 152 M208 142 Q165 127 123 148 M209 146 Q166 132 123 152"
          fill="none" stroke="#b58b4c" stroke-width="1.2" opacity=".9"/>
    <!-- Централна сгъвка -->
    <path d="M120 68 Q117 103 120 151 Q123 104 120 68Z" fill="#8b683c" opacity=".6"/>
    <path d="M116 70 Q111 106 117 143 M124 70 Q129 106 123 143" fill="none" stroke="#fff6d5" stroke-width="1.4" opacity=".85"/>
    <!-- Текстови редове -->
    <g fill="none" stroke="#80603b" stroke-linecap="round" opacity=".68">
      <path d="M45 75 Q72 68 101 82 M43 85 Q73 78 103 92 M43 95 Q73 88 103 102 M45 105 Q73 99 103 112 M48 115 Q75 109 104 122" stroke-width="1.6"/>
      <path d="M139 82 Q168 68 195 75 M137 92 Q167 78 197 85 M137 102 Q167 88 197 95 M137 112 Q167 98 195 105 M136 122 Q165 109 192 115" stroke-width="1.6"/>
    </g>
    <!-- Инициал в златист медальон -->
    <circle cx="73" cy="72" r="7" fill="#8f292b" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M70 76 V68 H75 Q79 68 76 72 Q80 75 75 76Z" fill="#f7dda0"/>
    <!-- Златен орнамент в долната част -->
    <path d="M88 132 Q103 124 117 136 Q103 144 88 132Z M152 132 Q137 124 123 136 Q137 144 152 132Z"
          fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M120 130 l3 5 -3 5 -3-5Z" fill="url(#gold)"/>
  </g>
  <!-- Малки декоративни искри -->
  <g fill="#d9ad4f">
    <path d="M27 35 l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/>
    <path d="M208 37 l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5Z"/>
    <circle cx="191" cy="54" r="1.5"/><circle cx="48" cy="45" r="1.2"/>
  </g>
</svg>
